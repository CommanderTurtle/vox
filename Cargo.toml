[package]
name = "vox"
version = "0.1.2"
edition = "2021"
description = "Global voice input/output booster for CLI AI agents"
authors = ["Voice Boost Team"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

async-trait = "0.1"
cpal = "0.15"

# Global hotkeys
rdev = "0.5"

# System tray
tray-icon = "0.19"

# Keyboard simulation
enigo = "0.6"

# Clipboard
arboard = "3"

# HTTP client (for cloud ASR APIs)
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# WebSocket client (for Microsoft Edge TTS, no API key required)
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
# rustls crypto provider (ring) — tokio-tungstenite needs one installed at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# SHA-256 (for Edge TTS Sec-MS-GEC token) and ISO-8601 timestamps
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"

# WAV encoding
hound = "3"

# Error handling
thiserror = "2"

# Base64 encoding (for Mimo ASR data URL)
base64 = "0.22"

# Gzip compression (for Doubao ASR binary-frame payloads)
flate2 = "1"
# UUID v4 (for Doubao X-Api-Request-Id)
uuid = { version = "1", features = ["v4"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Cross-thread communication
crossbeam = "0.8"

# Temp file for TTS audio playback
tempfile = "3"

# Native audio playback/decoding. ISO-MP4 + AAC gives the router direct M4A
# hoisting without ffmpeg, temporary conversions, or cloud services.
rodio = { version = "0.20", default-features = false, features = ["wav", "mp3", "symphonia-isomp4", "symphonia-aac", "symphonia-alac"] }

# Tiny local API used only by the separately built native microphone router.
tiny_http = { version = "0.12", optional = true }

# GUI for settings window
egui = "0.34"
# eframe needs explicit winit backends (x11 + wayland) on Linux, otherwise
# winit emits "platform not supported" at compile time. Both are enabled so
# the binary works under either session; the active one is chosen at runtime.
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
winit = { version = "0.30", default-features = false }
# Feature flags
[features]
default = ["cloud-asr"]
whisper-local = ["dep:whisper-rs"]
cloud-asr = []
mic-forwarder = ["dep:tiny_http"]

[[bin]]
name = "vox-mic-forwarder"
path = "src/bin/vox-mic-forwarder.rs"
required-features = ["mic-forwarder"]

[dependencies.whisper-rs]
version = "0.13"
optional = true

# Target-specific: Windows message pump for tray icon right-click
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Media_Multimedia"] }
clipboard-win = "5.4"
rfd = "0.15"

# Disable unused build artifacts to reduce compile time
[profile.release]
opt-level = "z"   # Optimize for size
lto = true
strip = true
codegen-units = 1

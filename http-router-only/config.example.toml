[server]
host = "0.0.0.0"
port = 8180
# Optional bearer token for inference endpoints. Health and route metadata stay readable.
api_key = ""
# Set a specific private web-app origin when browser clients use this gateway.
cors_origin = "*"

[backends]
crisper_url = "http://127.0.0.1:8172"
translator_url = "http://127.0.0.1:8176"
translator_api_key = ""
longcat_url = "http://127.0.0.1:8230"
# Native Vox router on the Windows host. Use the host's private address when
# vox-http runs in WSL and 127.0.0.1 is not mirrored into Windows.
router_url = "http://127.0.0.1:8182"

[routes.inbound]
source_language = "auto"
target_language = "English"

[routes.outbound]
source_language = "English"
target_language = "Spanish"

[crisper]
default_mode = "intended"
language = "auto"
chunk_duration = 30.0
stride = 26.0
context_words = 12
max_new_tokens = 256
candidate_max_new_tokens = 24
hotwords = ""

[longcat]
default_voice = ""
steps = 16
guidance_strength = 4.0
guidance_method = "apg"
seed = 1024
duration_scale = 1.0
# Identical to Vox desktop: when enabled, scan backward from the configured
# character position to the previous complete sentence and merge all WAVs.
# When disabled, send the full text once and return that one WAV directly.
concatenate_chunks = true
characters_per_request = 240

# Reference recordings (.wav/.mp3/.m4a) and verbatim UTF-8 .txt transcripts remain server-local.
# Add any number of uniquely named profiles; clients see only each profile's name.
# TTS callers may override seed per request without changing this default.
# [[voices]]
# name = "Ana"
# audio_path = "/home/alienl/multimedia/voices/ana-reference.m4a"
# transcript_path = "/home/alienl/multimedia/voices/ana-reference.txt"

[hotkey]
record_toggle = "Alt+`"
engine_switch = "Alt+Shift+E"
inject_mode_switch = "Alt+Shift+V"
tts_trigger = "Alt+T"
tts_voice_switch = "Alt+Shift+T"
tts_seed_increment = "Alt+Shift+S"
tts_seed_decrement = "Alt+Shift+A"
translate_text = "Alt+R"
translate_tts = "Alt+Shift+R"
record_translate_tts = "Alt+Shift+`"
record_translate_text = "Alt+Ctrl+R"
record_tts = "Alt+Ctrl+`"
translate_route_switch = "Alt+Shift+L"

[asr]
# Local ASR is the default (no cloud key needed). Start the whisper.cpp
# server (see [asr.whisper_cpp]) or point [asr.openai] at a local
# OpenAI-compatible server.
primary_engine = "whisper-cpp"
fallback_engines = ["openai"]

[asr.whisper_local]
model = "base"
model_path = ""

[asr.whisper_cpp]
# whisper.cpp HTTP server. Start with:
#   ./server -m ggml-base.en.bin -p 4 --port 8080
base_url = "http://127.0.0.1:8080"

[asr.mimo]
base_url = "https://token-plan-cn.xiaomimimo.com/v1"
api_key = ""
model = "mimo-v2.5-asr"

[asr.aliyun]
appkey = ""
token = ""

[asr.openai]
# OpenAI-compatible endpoint. Point base_url at a local server
# (e.g. faster-whisper-server) to use as local ASR, or keep the cloud URL
# with an api_key for OpenAI Whisper.
base_url = "https://api.openai.com/v1"
api_key = ""
model = "whisper-1"

[asr.doubao]
# Volcano Engine Doubao streaming ASR 2.0 (volc.seedasr.sauc.duration).
# Uses the Agent Plan endpoint (/api/v3/plan/sauc/...). When api_key is set,
# doubao-asr registers and becomes the default ASR engine.
api_key = ""

[asr.crisper]
# Local CrisperWhisper 2.0 service. Select intended/non-literal or literal
# transcript mode. From another LAN machine, replace
# 127.0.0.1 with the WSL host name/IP (for example alien.local).
base_url = "http://127.0.0.1:8172"
# Detect is a full MITM route: every Crisper language candidate -> EraX-VL
# fragment arbitration -> XLM language token -> one full Crisper transcript.
mitm_url = "http://127.0.0.1:8176"
mitm_api_key = ""
mode = "intended"
language = "detect"
chunk_duration = 30.0
stride = 26.0
context_words = 12
max_new_tokens = 256
candidate_max_new_tokens = 24
hotwords = ""

[inject]
mode = "keyboard"
restore_clipboard = true
copy_only = false

[tts]
# Free Microsoft Edge TTS — no API key required.
primary_engine = "edge-tts"
input_mode = "selection"

[tts.output]
# playback | clipboard_wav | mic_forwarder
mode = "playback"
mic_forwarder_url = "http://127.0.0.1:8182"

[subtitles]
# Independent physical-microphone and native system-playback taps are supplied
# by vox-mic-forwarder. Each caption window has its own non-destructive cursor.
router_url = "http://127.0.0.1:8182"
chunk_seconds = 3.0
font_size = 30.0
max_lines = 3
microphone_language = "detect"
system_language = "detect"
target_language = "English"

[tts.edge]
voice = "zh-CN-XiaoxiaoNeural"
rate = "+0%"
volume = "+0%"
pitch = "+0Hz"

[tts.mimo]
model = "mimo-v2.5-tts"
voice = "default"
speed = 1.0

[tts.doubao]
# Volcano Engine Doubao TTS 2.0 (seed-tts-2.0). Shares api_key with [asr.doubao].
# When the key is set, doubao-tts registers and becomes the default TTS engine.
speaker = "zh_female_vv_uranus_bigtts"
speech_rate = 0      # [-50, 100]; 0 = normal, 100 = 2x, -50 = 0.5x
loudness_rate = 0    # [-50, 100]; 0 = normal
sample_rate = 24000  # PCM sample rate

[tts.longcat]
# Local LongCat voice-cloning server. prompt_text must be the verbatim
# transcript of prompt_audio_path. Vox never modifies the LongCat service.
base_url = "http://127.0.0.1:8230"
prompt_audio_path = ""
prompt_text = ""
active_voice_profile = ""
# Add any number of named reference pairs in Settings, or directly as:
# [[tts.longcat.voice_profiles]]
# name = "Ana"
# audio_path = "C:/voices/ana.m4a"
# transcript_path = "C:/voices/ana.txt"
steps = 16
guidance_strength = 4.0
guidance_method = "apg"
seed = 1024
duration_scale = 1.0
# When enabled, scan backward from this character ceiling to the previous
# sentence-ending punctuation mark and concatenate the returned WAVs. When
# disabled, the full text is sent once and its single returned WAV is used.
concatenate_chunks = true
characters_per_request = 240

[translate]
# Standalone local translator (or another explicitly selected local
# OpenAI-compatible endpoint). Blank model discovers the first /v1/models
# entry. Translation never calls a cloud fallback.
enabled = false
asr = true
tts = false
base_url = "http://127.0.0.1:8176/v1"
api_key = ""
model = ""
max_tokens = 512
source_language = "auto"
target_language = "English"
active_route = "inbound"
system_prompt = "Translate faithfully into the requested target language. Return only the translation. Preserve names, numbers, formatting, profanity, and tone."

[translate.inbound]
source_language = "auto"
target_language = "English"

[translate.outbound]
source_language = "English"
target_language = "Spanish"

# Programmable end-to-end actions. All remain available from the tray; the
# hotkeys can be changed or cleared independently in Settings → Routes.
[[route_presets]]
id = "system-de-en-caption"
name = "German system audio → English captions"
enabled = true
hotkey = "Ctrl+Alt+1"
input = "system"
source_language = "de"
transcript_mode = "intended"
translate = true
target_language = "English"
output = "caption"

[[route_presets]]
id = "mic-en-tts-mic"
name = "English microphone → cloned voice microphone"
enabled = true
hotkey = "Ctrl+Alt+2"
input = "microphone"
source_language = "en"
transcript_mode = "intended"
translate = false
target_language = "English"
output = "mic_forwarder"

[[route_presets]]
id = "system-en-caption"
name = "English system audio → English captions"
enabled = true
hotkey = "Ctrl+Alt+3"
input = "system"
source_language = "en"
transcript_mode = "intended"
translate = false
target_language = "English"
output = "caption"

[[route_presets]]
id = "text-tts-mic"
name = "Selected text → cloned voice microphone"
enabled = true
hotkey = "Ctrl+Alt+4"
input = "selection"
source_language = "detect"

[hotkey]
record_toggle = "Alt+`"
engine_switch = "Alt+Shift+E"
inject_mode_switch = "Alt+Shift+V"
tts_trigger = "Alt+T"

[asr]
# Local ASR is the default (no cloud key needed). Start the whisper.cpp
# server (see [asr.whisper_cpp]) or point [asr.openai] at a local
# OpenAI-compatible server.
primary_engine = "whisper-cpp"
fallback_engines = ["openai"]

[asr.whisper_local]
model = "base"
model_path = ""

[asr.whisper_cpp]
# whisper.cpp HTTP server. Start with:
#   ./server -m ggml-base.en.bin -p 4 --port 8080
base_url = "http://127.0.0.1:8080"

[asr.mimo]
base_url = "https://token-plan-cn.xiaomimimo.com/v1"
api_key = ""
model = "mimo-v2.5-asr"

[asr.aliyun]
appkey = ""
token = ""

[asr.openai]
# OpenAI-compatible endpoint. Point base_url at a local server
# (e.g. faster-whisper-server) to use as local ASR, or keep the cloud URL
# with an api_key for OpenAI Whisper.
base_url = "https://api.openai.com/v1"
api_key = ""
model = "whisper-1"

[inject]
mode = "keyboard"

[tts]
# Free Microsoft Edge TTS — no API key required.
primary_engine = "edge-tts"
input_mode = "selection"

[tts.edge]
voice = "zh-CN-XiaoxiaoNeural"
rate = "+0%"
volume = "+0%"
pitch = "+0Hz"

[tts.mimo]
model = "mimo-v2.5-tts"
voice = "default"
speed = 1.0

[general]
autostart = true
language = "auto"
record_mode = "ptt"   # "ptt" (hold-to-talk) or "toggle" (press to start/stop)

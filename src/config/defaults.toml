[[route_presets]]
id = "text-en-clipboard"
name = "Selected text → English clipboard"
enabled = true
hotkey = "Ctrl+Alt+5"
input = "selection"
source_language = "detect"
transcript_mode = "intended"
translate = true
target_language = "English"
output = "clipboard"

[[route_presets]]
id = "mic-en-caption"
name = "English microphone → English captions"
enabled = true
hotkey = "Ctrl+Alt+6"
input = "microphone"
source_language = "en"
transcript_mode = "intended"
translate = false
target_language = "English"
output = "caption"

[[route_presets]]
id = "mic-en-zh-clipboard"
name = "English microphone → Chinese clipboard"
enabled = true
hotkey = "Ctrl+Alt+7"
input = "microphone"
source_language = "en"
transcript_mode = "intended"
translate = true
target_language = "Chinese"
output = "clipboard"

[general]
autostart = true
language = "auto"
record_mode = "ptt"   # "ptt" (hold-to-talk) or "toggle" (press to start/stop)
